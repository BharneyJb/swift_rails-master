org.gradle.jvmargs=-Xmx4096M -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxGCPauseMillis=500
android.useAndroidX=true
android.enableJetifier=true

# Ensure consistent Kotlin JVM target across all modules (including third-party plugins)
kotlin.compiler.jvmTarget=1.8
kotlin.jvm.target.validation.mode=warning
